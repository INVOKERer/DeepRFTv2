network_g:
  type: ATD
  upscale: 3
  in_chans: 3
  img_size: 64

  embed_dim: 48
  depths: [6, 6, 6, 6, ]
  num_heads: [4, 4, 4, 4, ]
  window_size: 16
  category_size: 128
  num_tokens: 64
  reducted_dim: 8
  convffn_kernel_size: 7
  img_range: 1.
  mlp_ratio: 1
  upsampler: 'pixelshuffledirect'
  resi_connection: '1conv'
  use_checkpoint: true
  ker_size: 64
  overlap_size: [16, 16]
  FKE: true
  sub_image: true
  norm_type: 'LayerNorm' # None # 'LayerNorm'
  enc_ker_layers: [ 1,1,1,1 ]
  baseblock_enc_ker: [ 'EVSS', 'EVSS','EVSS','EVSS' ]
  #  baseblock_enc_ker: ['AVSBlock', 'AVSBlock','AVSBlock','AVSBlock']
  save_memorys: [ false, false, false, false, false, false ]



path:
  pretrain_network_g: /home/ubuntu/150t/personal_data/mxt/MXT/ckpts/ATD-SR/lightx3_scratch.pth
#  pretrain_network_g: /data/mxt_code/DeepMXT/experiments/102_ATD_light-FKE_SRx3_finetune/models/net_g_250000.pth # /home/ubuntu/150t/personal_data/mxt/MXT/ckpts/SR/net_g_500000.pth
  strict_load_g: true
  param_key: params_ema

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name
  save_path: /home/ubuntu/150t/personal_data/mxt/MXT/exp_results/ATD-FKE/Lightx3_scratch
  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 3
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 3
      test_y_channel: true
train:
  optim_g:
    type: Adam
    #lr: !!float 2e-4
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [250000, 400000, 450000, 475000]
    #milestones: [5000, 10000, 15000, 20000，25000，30000，35000]
    gamma: 0.5

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  total_iter: 500000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean