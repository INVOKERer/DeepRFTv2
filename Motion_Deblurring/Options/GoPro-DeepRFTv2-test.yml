#  baseblock_enc_max_global: [ [ 'naf_nosca', 'naf_nosca', 'naf_nosca' ], [ 'naf_nosca', 'naf_nosca', 'naf_nosca' ] ] # localnaf naf_patch logfouriernaf LocalNAFEVSBlock_patch
